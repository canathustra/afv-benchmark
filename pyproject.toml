[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "afv-benchmark"
version = "0.1.0"
description = "Small, synthetic-first research examples for alpha-frequency variability measurement"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
afv-benchmark = "afv_benchmark.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
